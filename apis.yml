aid: tastewise
name: Tastewise
description: 'Tastewise is a food and beverage consumer-intelligence platform that reads
  live demand across social posts, recipes, restaurant menus and retail data, and exposes
  it to product-innovation, marketing, foodservice and retail-sales teams at CPG brands.
  The platform is built on menus from 1.4M+ restaurants, 12K+ retail brands, social signals
  from 90M+ consumers and a proprietary consumer panel. Tastewise sells a commercial REST
  API — documented publicly at docs.tastewise.io and served from api.tastewise.io — covering
  recipes, ingredients, dishes, restaurants, menus, consumer motivations, content discovery,
  trend validation and trend performance, plus an embedded widgets surface and bulk product-list
  operations with webhook callbacks. Access is per-customer: a bearer API key plus an X-Customer-Id
  header, with per-route permissions granted per contract. Customers include Nestle and Mars.'
