apis:
- aid: tastewise:tastewise-api
  name: Tastewise API
  description: 'Commercial REST API over the Tastewise food and beverage intelligence
    graph. Publicly documented operations span recipes (popular/trending), ingredients,
    dishes and side dishes, restaurants (search, detail, menus, ingredients, signals,
    bestsellers, price analysis, chain matching), menus and menu insights, consumer
    motivations, social content discovery, flavor combinations, trend validation and
    trend performance, a combined insights endpoint, an embedded widgets query surface,
    and product-list management with bulk import and webhook completion callbacks.
    Authentication is a bearer API key paired with an X-Customer-Id header, and each
    route requires a named permission on the account. No machine-readable OpenAPI is
    published; the reference is human-readable Slate documentation.'
  humanURL: https://docs.tastewise.io/
