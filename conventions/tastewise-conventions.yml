generated: '2026-08-29'
method: searched
source: https://docs.tastewise.io/
docs: https://docs.tastewise.io/
note: >-
  Cross-cutting runtime semantics read from the provider's published API reference. Where a
  convention is absent it is recorded as absent — Tastewise documents rate limiting, paging,
  caching and search syntax thoroughly, but publishes no idempotency, versioning or
  request-tracing contract.
authentication:
  style: bearer-api-key + tenant header
  headers:
  - Authorization: Bearer <api-key>
  - X-Customer-Id: <customer-id>
  detail: authentication/tastewise-authentication.yml
idempotency:
  supported: false
  header: null
  evidence: >-
    The API reference documents no Idempotency-Key header, no request-deduplication window
    and no replay semantics. The write surface (POST /restaurants/productList,
    POST /operations/productList, the bulk variants, DELETE /restaurants/productList) is
    documented without any idempotency guarantee, so a retried bulk import is not safe to
    assume duplicate-free.
  consequence_for_agents: >-
    An agent retrying a failed POST cannot rely on the server to deduplicate; it must track
    submitted SKUs itself.
pagination:
  style: offset-page
  params:
  - name: page
    description: Page number. Capped at 5 on /restaurants/pricingAnalysis.
  - name: page_size
    description: Results per page. Used by /restaurants, /operations.
  - name: results_per_page
    description: Alternate name used by the menus endpoints (default 50).
  - name: limit
    description: Maximum results, used by the recipes family; capped by plan.
  ceilings: rate-limits/tastewise-rate-limits.yml
  inconsistency: >-
    Three different parameter names govern page size across the surface (page_size,
    results_per_page, limit) — a real ergonomic wrinkle for a client generator.
  notes:
  - On /restaurants, setting the one-item-per-chain flag disables the page parameter entirely.
sorting:
  params: [sort_by, sort_order]
  applies_to: [/restaurants]
filtering:
  multiple_value_params: documented — repeated/multi-value query parameters are supported
  range_params: documented — range query parameters are supported
  encoding: all query parameters must be UTF-8 encoded
  measuring_system: metric throughout
search_syntax:
  supported: true
  operators:
  - AND
  - OR
  - NOT
  - exact search
  - exact search AND term
  docs: https://docs.tastewise.io/
versioning:
