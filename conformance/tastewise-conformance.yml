domain_standard:
  market: food and beverage consumer intelligence / foodservice menu data
  standard_declared: null
  conforms: false
  evidence: >-
    No domain standard is declared in the contract. The API's own vocabularies — cuisines,
    delivery platforms, markets, motivations, audiences, categories, life-cycle stages — are
    published as closed lists in the documentation but are proprietary Tastewise enumerations,
    not GS1, GDSN, FoodOn or any other published food-industry data standard. Restaurant and
